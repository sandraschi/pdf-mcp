[project]
name = "pdf-mcp"
version = "0.2.1"
description = "Full-stack PDF intelligence MCP server — extract, manipulate, annotate, convert, validate, and RAG-search PDFs"
authors = [{ name = "Sandra Schipal" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi",
    "uvicorn[standard]",
    "pymupdf",
    "pypdf>=5",
    "pdfplumber",
    "lancedb",
    "prefab-ui>=0.14",
    "Pillow",
    "jinja2",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
rag = ["sentence-transformers"]
test = ["pytest", "pytest-asyncio", "httpx"]
dev = ["ruff>=0.16.0,<0.17", "pyright", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
pdf-mcp = "pdf_mcp.server:main"
