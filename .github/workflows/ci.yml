name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Lint & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: uv sync --extra dev --extra test

      - name: Ruff check
        shell: pwsh
        run: |
          $paths = @('pdf_mcp')
          if (Test-Path 'tests') { $paths += 'tests' }
          uv run ruff check @paths

      - name: Ruff format check
        shell: pwsh
        run: |
          $paths = @('pdf_mcp')
          if (Test-Path 'tests') { $paths += 'tests' }
          uv run ruff format --check @paths

      - name: Pyright typecheck
        shell: pwsh
        run: uv run pyright pdf_mcp/

      - name: Pytest
        if: hashFiles('tests/**') != ''
        run: uv run python -m pytest tests/ -q --tb=short

      - name: Install web dependencies
        working-directory: webapp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: webapp
        run: bun run typecheck

      - name: Biome check
        working-directory: webapp
        run: bun run biome:ci

      - name: Install Playwright
        working-directory: webapp
        shell: pwsh
        run: |
          if ((Test-Path playwright.config.ts) -or (Test-Path playwright.config.js)) {
            npx playwright install chromium
          }

      - name: Run Playwright e2e
        working-directory: webapp
        shell: pwsh
        run: |
          if ((Test-Path playwright.config.ts) -or (Test-Path playwright.config.js)) {
            npx playwright test
          }
